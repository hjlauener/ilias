# Test-ILIAS wie auf dem Mac des Auftraggebers (srsolutions/ilias:11 + mariadb:10.11)
services:
  mysql:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: testpw123
      MARIADB_DATABASE: ilias
    command: --character-set-server=utf8 --collation-server=utf8_general_ci
  ilias:
    image: srsolutions/ilias:11
    depends_on:
      - mysql
    environment:
      ILIAS_AUTO_SETUP: "1"
      ILIAS_DB_USER: root
      ILIAS_DB_PASSWORD: testpw123
      ILIAS_ROOT_PASSWORD: TestAdmin1234
      ILIAS_HTTP_PATH: http://localhost:8080
    ports:
      - "8080:80"
